env:
  CI: "1"
  NO_COLOR: "1"

agents:
  queue: "linux-small"

steps:
  - label: ":git: Git 2.50.1"
    key: "git-toolchain"
    command: "bash .buildkite/scripts/build-modern-git.sh"
    if: build.source == "webhook" || build.env("TABELLIO_BUILD_CONTEXT") == "preflight" || build.branch == pipeline.default_branch
    timeout_in_minutes: 15
    artifact_paths:
      - ".artifacts/toolchain/git-2.50.1-linux-amd64.tar.gz"

  - label: ":test_tube: Repository check"
    key: "repository-check"
    command: "bash .buildkite/scripts/tests.sh"
    depends_on: "git-toolchain"
    if: build.source == "webhook" || build.env("TABELLIO_BUILD_CONTEXT") == "preflight" || build.branch == pipeline.default_branch
    timeout_in_minutes: 10
    artifact_paths:
      - "tabellio-pr-evidence.json"
    plugins:
      - mise#v1.1.4:
          version: "2026.2.11"

  - label: ":mag: Fallow changed-code"
    key: "fallow"
    command: "bash .buildkite/scripts/fallow.sh"
    depends_on: "git-toolchain"
    if: build.source == "webhook" || build.env("TABELLIO_BUILD_CONTEXT") == "preflight" || build.branch == pipeline.default_branch
    timeout_in_minutes: 10
    artifact_paths:
      - "fallow-audit.json"
    plugins:
      - mise#v1.1.4:
          version: "2026.2.11"

  - label: ":package: Package dry-run"
    key: "package"
    command: "bash .buildkite/scripts/package.sh"
    if: build.source == "webhook" || build.env("TABELLIO_BUILD_CONTEXT") == "preflight" || build.branch == pipeline.default_branch
    timeout_in_minutes: 10
    artifact_paths:
      - "package-dry-run.json"
    plugins:
      - mise#v1.1.4:
          version: "2026.2.11"

  - label: ":shield: Product validation"
    key: "product-validation"
    command: "bash .buildkite/scripts/product-validation.sh"
    depends_on: "git-toolchain"
    if: build.source == "webhook" || build.env("TABELLIO_BUILD_CONTEXT") == "preflight" || build.branch == pipeline.default_branch
    timeout_in_minutes: 50
    artifact_paths:
      - "tabellio-validation-result.json"
      - ".artifacts/tabellio/validation-ref.bundle"
      - ".artifacts/tabellio/validation-ref.sha"
    plugins:
      - mise#v1.1.4:
          version: "2026.2.11"
